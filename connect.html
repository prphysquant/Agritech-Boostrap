<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agritech App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles.css">

</head>

<body>


    <div class="logo-container">
        <img src="favico.png" alt="Logo" class="rounded">
        <span>Agritech App</span>
    </div>


    <div class="login-card card p-4 shadow rounded">

        <h4 class="text-center fw-bold mb-3">Login</h4>

        <form>
            <div class="mb-3">
                <label for="email" class="form-label required">Veuillez saisir votre Email</label>
                <input type="email" class="form-control" id="email" placeholder="E-mail" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label required">Veuillez saisir votre Mot de Passe</label>
                <input type="password" class="form-control" id="password" placeholder="Mot de passe" required>
            </div>

            <div class="d-flex justify-content-end mb-3">
                <a href="#" class="text-decoration-none small">Se souvenir de moi</a>
            </div>

            <a href="index.html" class="btn btn-warning w-50 fw-bold mb-3 text-center">Login</a>

        </form>

        <hr>


        <div class="text-center mb-3">
            <p class="mb-2">Veuillez contacter un administrateur si vous avez oublié votre mot de passe</p>
        </div>

    </div>

</body>

</html>
